[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taxdome-test-task"
version = "0.1.0"
description = "TaxDome test task"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1,<2.0",
    "fastapi>=0.162.0,<0.163.0",
    "SQLAlchemy>=2.1.6,<3.0",
    "psycopg[binary]>=3.3.6,<4.0",
    "uvicorn>=0.54.0,<0.55.0",
]

[project.optional-dependencies]
test = ["httpx2>=2.15.1,<2.16.0"]
dev = ["ruff>=0.17.3,<0.18.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
