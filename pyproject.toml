[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taxdome-test-task"
version = "0.1.0"
description = "TaxDome test task"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1,<2.0",
    "fastapi>=0.162.0,<0.163.0",
    "SQLAlchemy>=2.1.6,<3.0",
    "psycopg[binary]>=3.3.6,<4.0",
    "uvicorn>=0.54.0,<0.55.0",
]

[tool.setuptools.packages.find]
where = ["src"]
